name: CI & Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build Rover and Rover-Setup
        shell: powershell
        run: |
          python -m PyInstaller --noconfirm Rover.spec
          New-Item -ItemType Directory -Force -Path payload | Out-Null
          Copy-Item -Force "dist/Rover.exe" "payload/Rover.exe"
          python -m PyInstaller --noconfirm Rover-Setup.spec

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rover-windows-x64
          path: |
            dist/Rover.exe
            dist/Rover-Setup.exe

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Rover.exe
            dist/Rover-Setup.exe
